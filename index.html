<!doctype html><html><head><meta charset="utf-8"><title>AgentHelm</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css"><script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script><script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* layout: fixed project rail + scrolling workspace; summary strip first, detail below */
:root{--bg:#f6f7f9;--panel:#fff;--fg:#14171c;--mut:#5b6471;--bd:#e3e6eb;--hov:#eef1f5;--ac:#2a78d6;--acfg:#fff;--good:#008300;
--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;color-scheme:light;
--ui:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--panel:#1a1d22;--fg:#e8eaee;--mut:#a0a8b4;--bd:#2b3038;--hov:#242830;--ac:#3987e5;--good:#0ca30c;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111418;--panel:#1a1d22;--fg:#e8eaee;--mut:#a0a8b4;--bd:#2b3038;--hov:#242830;--ac:#3987e5;--good:#0ca30c;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--ui);display:flex;height:100vh}
aside{width:280px;background:var(--panel);border-right:1px solid var(--bd);overflow:auto;padding:16px 12px;flex-shrink:0}
main{flex:1;min-width:0;overflow:auto;padding:20px 24px}
h1{font-size:15px;font-weight:600;margin:0 0 4px}.mut{color:var(--mut);font-size:12px}
.proj{padding:7px 9px;border-radius:7px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;word-break:break-all;font-size:13px}
.proj:hover{background:var(--hov)}.proj.sel{background:var(--hov);box-shadow:inset 3px 0 0 var(--ac)}
.badge{background:var(--hov);color:var(--mut);border-radius:10px;padding:1px 8px;font-size:11px;white-space:nowrap;text-decoration:none}
.run{background:var(--good);color:#fff}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0;align-items:center}
button,select,input,textarea{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--bd);border-radius:7px;padding:5px 11px}
button{cursor:pointer}button:hover{background:var(--hov)}button.on{background:var(--ac);color:var(--acfg);border-color:var(--ac)}
:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.card{border:1px solid var(--bd);background:var(--panel);border-radius:10px;padding:14px 16px;margin:12px 0}
.card h3{margin:0 0 4px;font-size:14px;font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.q{white-space:pre-wrap;margin:6px 0;font-size:13px;overflow-wrap:anywhere}.q b{color:var(--mut);font-weight:500}
textarea{width:100%;min-height:70px;font-family:var(--mono);font-size:12px}
.live{background:var(--bg);border:1px solid var(--bd);border-radius:7px;padding:8px;max-height:420px;overflow:auto;font:12px var(--mono);margin-top:8px}
.live .ln{white-space:pre-wrap;margin:2px 0}.live .you{color:var(--mut)}.live .tool{color:var(--fg);opacity:.75}.live .res{color:var(--mut)}.live .err{color:#d33}.live .sys{color:var(--mut);font-style:italic}
.chip{border:1px solid var(--bd);background:var(--panel);border-radius:999px;padding:3px 10px;cursor:pointer;font-size:12px}.chip.on{border-color:var(--ac);color:var(--ac)}
#tmain{height:calc(100vh - 120px);min-height:360px}.tv{height:100%;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:6px}.tv .xterm{height:100%}
button.primary{background:var(--ac);color:var(--acfg);border-color:var(--ac)}
#npm{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px}#npm[hidden]{display:none}.npb{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:16px;width:min(560px,100%);max-height:90vh;display:flex;flex-direction:column;gap:10px}.npl{overflow:auto;max-height:42vh;border:1px solid var(--bd);border-radius:8px}
#chatv{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}#chatv[hidden]{display:none}
.chd{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.cbody{flex:1;overflow:auto;padding:14px 16px;max-width:980px;width:100%;margin:0 auto}
.cm{margin:10px 0}.cw{font-size:11px;color:var(--mut);margin-bottom:3px}.cb{white-space:pre-wrap;line-height:1.5;overflow-wrap:anywhere}
.cu .cb{background:var(--panel);border:1px solid var(--bd);border-radius:8px;padding:8px 12px}.ca .cb{padding:0 2px}
.ct,.co{font:12px var(--mono);color:var(--mut)}.ce summary{color:#d33}.cbody.notools .ct,.cbody.notools .co{display:none}
.cb pre,.co .acts{font-size:12px;font-weight:400;margin-left:6px}.acts a{margin-right:8px}.c2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
select.st{padding:1px 6px;border-radius:10px;font-size:11px;background:var(--hov);border:0;color:var(--mut)}
.mw{position:relative}.mm{position:absolute;z-index:6;top:100%;left:0;margin-top:4px;background:var(--panel);border:1px solid var(--bd);border-radius:8px;padding:4px;display:flex;flex-direction:column;min-width:170px;box-shadow:0 6px 20px #0004}.mm[hidden]{display:none}.mm button{text-align:left;border:0;background:none;padding:6px 10px}.mm button:hover{background:var(--hov)}
.tabs{display:flex;gap:6px;margin:8px 0}.tabs button{padding:2px 10px;font-size:12px}.tabs .on{background:var(--ac);color:var(--acfg);border-color:var(--ac)}
.card h3 .tt{cursor:default}
#tabs{position:sticky;top:0;z-index:20;background:var(--bg);margin:0 0 10px;padding:6px 0 0;gap:0;border-bottom:1px solid var(--bd);flex-wrap:nowrap;overflow-x:auto}
#tabs button{border:0;border-radius:0;background:none;padding:9px 14px;border-bottom:2px solid transparent;color:var(--mut);white-space:nowrap}
#tabs button:hover{background:var(--hov);color:var(--fg)}
#tabs button.on{background:none;color:var(--fg);border-bottom-color:var(--ac);font-weight:600}
#stats{gap:10px;margin:2px 0 10px}#stats .tile{padding:8px 12px;display:flex;align-items:baseline;gap:8px}#stats .tile .n{font-size:20px}
#stats.min .wide{display:none}
@media(max-width:800px){#stats .tile{padding:6px 10px}}
#upd{position:fixed;bottom:18px;right:24px;z-index:40;box-shadow:0 6px 24px #0006;border-radius:999px;padding:8px 16px}#upd[hidden]{display:none}
pre{white-space:pre-wrap;margin:6px 0}.cb code{font:12px var(--mono);background:var(--hov);padding:1px 4px;border-radius:4px}
pre{white-space:pre-wrap;background:var(--bg);border:1px solid var(--bd);border-radius:7px;padding:8px;max-height:300px;overflow:auto;font:12px var(--mono)}
details{margin:8px 0}summary{cursor:pointer;color:var(--ac);font-weight:500}a{color:var(--ac)}
.pill{display:inline-flex;gap:5px;align-items:center;font-size:11px;color:var(--mut);background:var(--hov);border-radius:10px;padding:1px 8px}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--s1)}
.st-later i{background:var(--s2)}.st-revisit i{background:var(--s3)}.st-done i{background:var(--s4)}
/* summary strip */
#stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) ;gap:12px;margin:4px 0 14px}
.tile{background:var(--panel);border:1px solid var(--bd);border-radius:10px;padding:12px 14px}
.tile .n{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .l{color:var(--mut);font-size:12px}
.wide{grid-column:span 2;min-width:0}
.stack{display:flex;gap:2px;height:14px;margin:10px 0 8px}
.stack div{border-radius:4px;min-width:3px}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut)}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.leg b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
#tip{position:fixed;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12px;padding:4px 8px;border-radius:6px;z-index:9;display:none;white-space:nowrap}
svg text{fill:var(--mut);font:11px var(--ui)}
@media(max-width:800px){body{flex-direction:column;height:auto}aside{width:auto;max-height:200px;border-right:0;border-bottom:1px solid var(--bd)}main{padding:14px 16px;overflow:visible}#stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(prefers-reduced-motion:no-preference){button,.proj{transition:background .12s}}
.car{display:inline-block;width:22px;text-align:center;margin:-4px 0 -4px -6px;padding:4px 0;border-radius:4px;color:var(--mut);cursor:pointer}.car:hover{background:var(--bd)}.grp{font-weight:600}.kid{margin-left:18px;font-weight:400;font-size:12px}.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto;align-items:start}
.col{background:var(--panel);border:1px solid var(--bd);border-radius:10px;padding:8px;min-height:180px}.col.over{outline:2px dashed var(--ac)}
.colh{font-weight:600;display:flex;gap:6px;align-items:center;margin-bottom:6px}.colh i{width:10px;height:10px;border-radius:3px}
.bc{border:1px solid var(--bd);background:var(--bg);border-radius:8px;padding:8px;margin:6px 0;cursor:grab}.bt{font-weight:500;font-size:13px;overflow-wrap:anywhere}
.foc{outline:2px solid var(--ac);outline-offset:2px}.hl{background:color-mix(in srgb,var(--s4) 35%,transparent);border-radius:2px}
#help{position:fixed;right:14px;bottom:14px;background:var(--panel);border:1px solid var(--bd);border-radius:10px;padding:10px 14px;font-size:12px;z-index:8;display:none;line-height:1.7}
table{border-collapse:collapse;width:100%;font-size:12px}td,th{padding:5px 8px;border-bottom:1px solid var(--bd);text-align:left;overflow-wrap:anywhere}th{color:var(--mut);font-weight:500}.tw{overflow-x:auto}
</style></head><body>
<aside><h1>AgentHelm <button id="th" style="float:right;padding:1px 8px;font-size:11px">theme</button></h1><div class="mut" id="sum"></div><select id="agsel" title="coding agent" style="width:100%;margin:6px 0"></select><label class="mut" style="display:block;margin:8px 0"><input type="checkbox" id="hb" checked style="padding:0"> hide backup dirs</label><div id="projs"></div></aside>
<main><div class="bar" id="tabs"></div><div id="newp" hidden></div><div id="trm" hidden></div><div id="skl" hidden></div><div id="lib" hidden></div><div id="hyp" hidden></div><div id="opt" hidden></div><div id="tkt" hidden></div><div id="wtp" hidden></div><div id="srp" hidden></div><div id="sess"><div class="bar"><select id="recent"></select><button id="qs" title="full-text search inside every chat">search inside chats</button><input id="q" placeholder="filter sessions by title, folder, ticket or note  ( / )" style="flex:1;min-width:160px"></div><div id="stats"></div><div class="bar" id="filters"></div><div id="wtb"></div><div id="rules"></div><div id="list"></div></div></main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ST=['active','later','revisit','done'];
let lim=50,limKey='',hc='',hq='',TK=[],TRE=null,openG=new Map(),pg=false,tab='sessions',D={sessions:[],liveProcs:0,jira:''},focusId='',proj='ALL',agent='all',flt='all',rulesCache={},view='cards';
const LSx={get:k=>{try{return localStorage.getItem('hub.'+k)}catch{return null}},set:(k,v)=>{try{localStorage.setItem('hub.'+k,v)}catch{}}};
try{const t=LSx.get('theme');if(t)document.documentElement.dataset.theme=t;proj=LSx.get('proj')||'ALL';pg=LSx.get('pg')==='1';flt=LSx.get('flt')||'all';view=LSx.get('view')||'cards';openG=new Map(JSON.parse(LSx.get('open')||'[]'))}catch{}
const api=(p,b)=>fetch(p,b?{method:'POST',headers:{'content-type':'application/json','x-hub':'1'},body:JSON.stringify(b)}:{headers:{'x-hub':'1'}}).then(r=>r.json());
const ago=t=>{const s=(Date.now()-t)/1000;return s<60?'now':s<3600?Math.floor(s/60)+'m ago':s<86400?Math.floor(s/3600)+'h ago':Math.floor(s/86400)+'d ago'};
const fmt=t=>t?new Date(t).toLocaleString([],{dateStyle:'medium',timeStyle:'short'}):'?';
const link=s=>esc(s).replace(/(https?:\/\/[^\s<)]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>').replace(TRE?new RegExp(TRE.source,'g'):/$^/,(m,o,str)=>!D.jira||str.slice(Math.max(0,o-2),o)==='">'||str.slice(o-1,o)==='/'?m:`<a href="${D.jira}${m}" target="_blank" rel="noopener">${m}</a>`);
const tickets=s=>TRE?[...new Set(((s.name||'')+' '+s.title+' '+s.first+' '+s.last+' '+s.cwd).match(TRE)||[])]:[];
const short=c=>c.replace(/^\/home\/[^/]+\//,'~/');
// Only changes you would want to see count; a session merely being active (new messages) does not.
const rowSig=s=>s.status+':'+(s.running?1:0)+':'+(s.name||'')+':'+(s.note||'');
let lastSig='';
const sigOf=d=>d.sessions.map(s=>s.id+':'+rowSig(s)).join('|');
function showUpd(n){let b=$('#upd');if(!b){b=document.createElement('button');b.id='upd';b.className='primary';b.onclick=()=>{b.hidden=true;draw()};document.body.appendChild(b)}b.textContent=n+' session'+(n==1?'':'s')+' updated - click to refresh the list';b.hidden=false}
const sessUrl=()=>'/api/sessions'+(agent!=='all'?'?agent='+agent:'');
function drawAgents(){const A=D.agents||[],el=$('#agsel');el.innerHTML='<option value="all">All agents</option>'+A.map(a=>`<option value="${a.id}" ${a.installed?'':'disabled'}>${esc(a.label)}${a.installed?'':' (not installed)'}</option>`).join('');el.value=agent;el.onchange=()=>{agent=el.value;syncHash();load()}}
async function load(){D=await api(sessUrl());drawAgents();TK=D.tickets||[];TRE=TK.length?new RegExp('\\b(?:'+TK.join('|')+')-\\d+\\b','g'):null;lastSig=sigOf(D);const b=$('#upd');if(b)b.hidden=true;draw()}
// Background refresh never redraws the page under you: it only fetches, and offers a refresh button if something changed.
async function poll(){
  if(document.hidden)return;
  const d=await api(sessUrl()).catch(()=>null);if(!d||!d.sessions)return;
  const sg=sigOf(d);if(sg===lastSig){D=d;return}
  const old=new Map(D.sessions.map(s=>[s.id,rowSig(s)]));let n=0;for(const s of d.sessions)if(old.get(s.id)!==rowSig(s))n++;
  const added=d.sessions.filter(s=>!old.has(s.id)).length;D=d;lastSig=sg;if(n||added)showUpd(n)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
function draw(){
  const S=D.sessions.filter(s=>!($('#hb').checked&&(/\/backup(\/|$)/.test(s.repo||s.cwd)||/backup-/.test(s.cwd)))),by={};S.forEach(s=>(by[s.cwd]??=[]).push(s));
  const run=S.filter(s=>s.running).length;
  $('#sum').textContent=`${S.length} sessions · ${Object.keys(by).length} projects · ${run} running · ${D.liveProcs} claude procs`;
  const gm={};S.forEach(s=>(gm[s.repo||s.cwd]??=[]).push(s));
  const G=Object.entries(gm).map(([r,l])=>{const dirs={};l.forEach(s=>(dirs[s.cwd]??=[]).push(s));return{r,l,dirs,t:Math.max(...l.map(s=>s.mtime))}}).sort((a,b)=>b.t-a.t);
  const kid=(r,d)=>{if(d===r)return 'main checkout';const b=d.split('/').pop(),rb=r.split('/').pop().toLowerCase().replace(/_/g,'-'),nb=b.toLowerCase().replace(/_/g,'-');return nb.startsWith(rb+'-')?b.slice(rb.length+1):b};
  $('#projs').innerHTML=`<div class="proj ${proj==='ALL'?'sel':''}" data-p="ALL"><span>All projects</span><span class="badge">${S.length}</span></div>`+G.map(g=>{
    const ds=Object.entries(g.dirs).sort((a,b)=>b[1][0].mtime-a[1][0].mtime),multi=ds.length>1||ds[0][0]!==g.r,live=g.l.some(s=>s.running);
    const open=multi&&(openG.has(g.r)?openG.get(g.r):(proj===g.r||ds.some(([d])=>d===proj)));
    return `<div class="proj grp ${proj===g.r&&pg?'sel':''}" data-p="${esc(g.r)}" data-g="1"><span>${multi?`<span class="car" data-car="${esc(g.r)}" data-open="${open?1:0}">${open?'&#9662;':'&#9656;'}</span> `:''}${esc(g.r.split('/').pop())}</span><span>${live?'<span class="badge run">live</span> ':''}<span class="badge">${g.l.length}</span></span></div>`+
     (open?ds.map(([d,l])=>`<div class="proj kid ${proj===d&&!pg?'sel':''}" data-p="${esc(d)}"><span>${esc(kid(g.r,d))}</span><span>${l.some(s=>s.running)?'<span class="badge run">live</span> ':''}<span class="badge">${l.length}</span></span></div>`).join(''):'')}).join('');
  document.querySelectorAll('#projs [data-p]').forEach(e=>e.onclick=ev=>{const c=ev.target.closest('[data-car]');if(c){ev.stopPropagation();const r=c.dataset.car,cur=c.dataset.open==='1';openG.set(r,!cur);draw();return}proj=e.dataset.p;pg=!!e.dataset.g;if(pg&&e.querySelector('[data-car]'))openG.set(proj,true);draw();loadRules();if(tab!=='sessions')setTab(tab)});
  const rs=[...S].sort((a,b)=>b.mtime-a.mtime).slice(0,15);
  $('#recent').innerHTML='<option value="">Recent chats...</option>'+rs.map(s=>`<option value="${s.id}">${esc((s.name||s.title||s.first.slice(0,50)||s.id).slice(0,60))} &middot; ${ago(s.mtime)}</option>`).join('');
  $('#recent').onchange=e=>{if(e.target.value)jump(e.target.value)};
  const cnt=k=>S.filter(s=>inProj(s)&&(k==='all'||(k==='running'?s.running:s.status===k))).length;
  $('#filters').innerHTML=['all','running',...ST].map(k=>`<button class="${flt===k?'on':''}" data-f="${k}">${k} (${cnt(k)})</button>`).join('')+`<button id="vw">${view==='board'?'card view':'board view'}</button><button id="ins">${LSx.get('ins')==='1'?'hide insights':'insights'}</button><button id="rf">refresh</button>`;
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{flt=b.dataset.f;draw()});$('#rf').onclick=load;$('#ins').onclick=()=>{LSx.set('ins',LSx.get('ins')==='1'?'0':'1');draw()};$('#vw').onclick=()=>{view=view==='board'?'cards':'board';draw()};
  const qq=($('#q').value||'').toLowerCase();
  const L=S.filter(s=>(!qq||(s.name+' '+s.title+' '+s.first+' '+s.last+' '+s.cwd+' '+s.id+' '+s.note).toLowerCase().includes(qq))&&inProj(s)&&(flt==='all'||(flt==='running'?s.running:s.status===flt)));
  const lk=proj+'|'+pg+'|'+flt+'|'+qq;if(lk!==limKey){limKey=lk;lim=50}
  if(focusId){const ix=L.findIndex(s=>s.id===focusId);if(ix>=lim)lim=ix+1}
  $('#list').innerHTML=L.slice(0,lim).map(card).join('')+(L.length>lim?`<div class="row"><button id="more">show ${Math.min(50,L.length-lim)} more</button><span class="mut">${L.length-lim} of ${L.length} not shown</span> <button id="all">show all</button></div>`:'')||'<p class="mut">none</p>';
  stats(S);if($('#more')){$('#more').onclick=()=>{lim+=50;draw()};$('#all').onclick=()=>{lim=1e9;draw()}}if(view==='board'){$('#list').innerHTML=board(L);bindBoard()}else bind();
  const fc=focusId&&document.querySelector('.card[data-id="'+focusId+'"]');if(fc)fc.classList.add('foc');focusId='';
  syncHash();LSx.set('proj',proj);LSx.set('pg',pg?1:0);LSx.set('flt',flt);LSx.set('view',view);LSx.set('open',JSON.stringify([...openG]));
}
const SC={active:'--s1',later:'--s2',revisit:'--s3',done:'--s4'};
function tipOn(el,t){el.onmousemove=e=>{const p=$('#tip');p.textContent=t;p.style.display='block';p.style.left=e.clientX+12+'px';p.style.top=e.clientY+12+'px'};el.onmouseleave=()=>$('#tip').style.display='none'}
function stats(S){
  const sc=S.filter(s=>inProj(s)),n=k=>sc.filter(s=>s.status===k).length,T=sc.length||1;
  const open=n('later')+n('revisit');
  const seg=ST.map(k=>({k,v:n(k)})).filter(x=>x.v);
  const days=[...Array(14)].map((_,i)=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-(13-i));return d});
  const cnt=days.map(d=>sc.filter(s=>s.mtime>=d&&s.mtime<d.getTime()+864e5).length),mx=Math.max(1,...cnt);

  api('/api/auto-close-preview').then(p=>{$('#acx').innerHTML=`${p.n} session(s) idle ${p.days}+ days with no tag. They are marked done automatically every 6 hours (running sessions and ones you tagged are never touched). Tags are backed up daily to ~/.claude/hub-backups. <button id="acn" ${p.n?'':'disabled'}>Close them now</button>`;$('#acn').onclick=async()=>{const r=await api('/api/auto-close',{});await load();drawOpt()}});
  $('#ci').onclick=async()=>{if(!confirm('Close '+idle.length+' idle claude process(es)?'))return;await api('/api/kill-idle',{});drawOpt()};
  el.querySelectorAll('[data-k]').forEach(b=>b.onclick=async()=>{if(b.dataset.b&&!confirm('This one was active in the last 15 minutes. Close it anyway?'))return;const r=await api('/api/kill',{pid:b.dataset.k,force:!!b.dataset.b});if(r.error)alert(r.error);drawOpt()});
}

/* ---- board ---- */
function board(L){return `<div class="board">`+ST.map(k=>{const l=L.filter(s=>s.status===k);return `<div class="col" data-col="${k}"><div class="colh"><i style="background:var(${SC[k]})"></i>${k} <span class="badge">${l.length}</span></div>`+l.map(s=>`<div class="bc" draggable="true" data-id="${s.id}"><div class="bt">${esc(s.name||s.title||s.first.slice(0,60)||s.id)}</div><div class="mut">${esc(short(s.cwd).split('/').pop())} - ${ago(s.mtime)} ${s.running?'<span class="badge run">running</span>':''}</div>${acts(s.id)} ${tickets(s).slice(0,2).map(t=>`${D.jira?`<a class="badge" href="${D.jira}${t}" target="_blank" rel="noopener">${t}</a>`:`<span class="badge">${t}</span>`}`).join(' ')}</div>`).join('')+`</div>`}).join('')+`</div><div class="mut">Drag a card to another column to change its status.</div>`}
function bindBoard(){
  document.querySelectorAll('.bc').forEach(c=>c.ondragstart=e=>e.dataTransfer.setData('text/plain',c.dataset.id));
  document.querySelectorAll('.col').forEach(c=>{c.ondragover=e=>{e.preventDefault();c.classList.add('over')};c.ondragleave=()=>c.classList.remove('over');
    c.ondrop=async e=>{e.preventDefault();c.classList.remove('over');const id=e.dataTransfer.getData('text/plain');if(id){await api('/api/tag',{id,status:c.dataset.col});load()}}});
}
function jump(id){focusId=id;proj='ALL';pg=false;flt='all';$('#q').value='';setTab('sessions');draw();const c=document.querySelector(`.card[data-id="${id}"]`);if(c){c.scrollIntoView({block:'center'});c.classList.add('foc')}}
/* ---- tickets ---- */
/* ---- work items: sessions grouped by ticket id, GitHub issue/PR, or a feature/bug/chore tag ---- */
let wk='',wkind='all';
const KINDS=['feature','bug','chore'];
const ghRefs=s=>{const out=new Set(),txt=(s.name||'')+' '+s.title+' '+s.first;
  for(const m of txt.matchAll(/github\.com\/([\w.-]+\/[\w.-]+)\/(?:issues|pull)\/(\d+)/g))out.add(m[1]+'#'+m[2]);
  const rn=(s.repo||s.cwd).split('/').pop();for(const m of ((s.name||'')+' '+s.title).matchAll(/(?:^|\s)#(\d{1,6})\b/g))out.add(rn+'#'+m[1]);return [...out]};
const itemLink=k=>/^[\w.-]+\/[\w.-]+#\d+$/.test(k)?'https://github.com/'+k.replace('#','/issues/'):(D.jira&&TRE&&/^[A-Z][A-Z0-9]*-\d+$/.test(k)?D.jira+k:'');
function drawTickets(){
  const m={};D.sessions.forEach(s=>[...tickets(s),...ghRefs(s)].forEach(k=>(m[k]??=[]).push(s)));
  const E=Object.entries(m).filter(([k,l])=>wkind==='all'||l.some(s=>s.kind===wkind)).sort((a,b)=>Math.max(...b[1].map(x=>x.mtime))-Math.max(...a[1].map(x=>x.mtime)));
  const loose=D.sessions.filter(s=>s.kind&&!tickets(s).length&&!ghRefs(s).length&&(wkind==='all'||s.kind===wkind));
  const row=s=>`<div class="row"><span class="pill st-${s.status}"><i></i>${s.status}</span>${s.kind?`<span class="badge">${s.kind}</span>`:''}<a href="#" data-j="${s.id}">${esc(s.name||s.title||s.first.slice(0,70)||s.id)}</a><span class="mut">${esc(short(s.cwd).split('/').pop())} - ${ago(s.mtime)}</span> ${acts(s.id)}</div>`;
  $('#tkt').innerHTML=`<h1>Work items</h1><div class="mut">Sessions grouped by what they are for: a ticket id${TK.length?'':' (set TICKET_PREFIXES to enable, JIRA_BASE to link)'}, a GitHub issue or PR (a github.com link, or #123 in the session name), or a feature / bug / chore tag you set from the card menu.</div>
  <div class="bar"><button data-wk="all" class="${wkind==='all'?'on':''}">all</button>${KINDS.map(k=>`<button data-wk="${k}" class="${wkind===k?'on':''}">${k}</button>`).join('')}<input id="tq" placeholder="filter by id or text" style="flex:1;min-width:160px" value="${esc(wk)}"></div><div id="tl"></div>`;
  const draw2=()=>{const q=wk.toLowerCase();
    const g=E.filter(([k,l])=>!q||k.toLowerCase().includes(q)||l.some(s=>(s.name+' '+s.title).toLowerCase().includes(q))).map(([k,l])=>{const repos=[...new Set(l.map(s=>(s.repo||s.cwd).split('/').pop()))],u=itemLink(k);return `<div class="card"><h3>${u?`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(k)}</a>`:esc(k)} <span class="badge">${l.length} sessions</span> ${repos.map(r=>`<span class="badge">${esc(r)}</span>`).join(' ')}</h3>`+l.sort((a,b)=>b.mtime-a.mtime).slice(0,8).map(row).join('')+`</div>`}).join('');
    const lo=loose.filter(s=>!q||(s.name+' '+s.title).toLowerCase().includes(q));
    $('#tl').innerHTML=(g||'')+(lo.length?`<div class="card"><h3>Tagged, no ticket <span class="badge">${lo.length}</span></h3>${lo.sort((a,b)=>b.mtime-a.mtime).slice(0,30).map(row).join('')}</div>`:'')||'<p class="mut">nothing yet. Tag a session as feature, bug or chore from its card menu, or put a ticket id or #123 in its name.</p>';
    $('#tl').querySelectorAll('[data-j]').forEach(a=>a.onclick=e=>{e.preventDefault();jump(a.dataset.j)})};
  $('#tq').oninput=e=>{wk=e.target.value;draw2()};
  $('#tkt').querySelectorAll('[data-wk]').forEach(b=>b.onclick=()=>{wkind=b.dataset.wk;drawTickets()});draw2();
}
/* ---- worktrees ---- */
async function drawWt(fresh){
  const el=$('#wtp');el.innerHTML='<p class="mut">scanning worktrees (git status on each, about 10-20 s)...</p>';
  const W=await api('/api/worktrees'+(fresh?'?fresh=1':'')),el2=W.rows.filter(r=>r.eligible),sk=r=>r.path.replace(/^\/home\/[^/]+\/projects\//,'');
  el.innerHTML=`<h1>Worktrees (${W.rows.length})</h1><div class="mut">Eligible = idle ${W.idleDays}+ days (last commit and last Claude session), clean, nothing unpushed, not running. Removal uses git worktree remove without --force; branches are kept.</div>
  <div class="bar"><button id="wre" ${el2.length?'':'disabled'}>Remove all eligible (${el2.length})</button><button id="wrf">rescan</button><span class="mut" id="wm"></span></div>
  ${W.orphans.length?`<div class="card"><h3>Orphans (${W.orphans.length}) <span class="mut">git link points at a deleted repo</span></h3>${W.orphans.map(o=>`<div class="row"><span>${esc(sk({path:o}))}</span><button data-o="${esc(o)}">delete folder</button></div>`).join('')}</div>`:''}
  <div class="bar"><select id="wsf"><option value="all">all states</option><option value="eligible">eligible</option><option value="recent">recent</option><option value="dirty">dirty</option><option value="unpushed">unpushed</option><option value="missing">missing</option><option value="running">running</option></select><input id="wsq" placeholder="filter by repo / name / branch" style="min-width:220px"><button id="wsa">select shown</button><button id="wsn">clear</button>
   <label class="mut"><input type="checkbox" id="wdb"> also delete branch (only if fully merged)</label><button id="wrs" class="primary" disabled>Remove selected (0)</button></div>
  <div id="wbox"></div><div class="tw"><table id="wtt"></table></div>`;
  $('#wrf').onclick=()=>drawWt(true);
  $('#wre').onclick=async()=>{if(!confirm('Remove '+el2.length+' eligible worktrees? Branches are kept; ignored files like .env in them are deleted.'))return;$('#wm').textContent='removing...';const r=await api('/api/wt-remove-eligible',{});alert('removed '+r.removed+', failed '+r.failed+(r.errors.length?'\n'+r.errors.join('\n'):''));drawWt(true)};
  const sel=new Set();
  const shown=()=>{const f=$('#wsf').value,q=$('#wsq').value.toLowerCase();return W.rows.filter(r=>(f==='all'||r.state===f)&&(!q||(r.repo+' '+r.path+' '+(r.branch||'')).toLowerCase().includes(q)))};
  const upd=()=>{const n=sel.size;$('#wrs').textContent='Remove selected ('+n+')';$('#wrs').disabled=!n};
  const paint=()=>{const R=shown();$('#wtt').innerHTML='<tr><th></th><th>repo</th><th>worktree</th><th>branch</th><th>idle</th><th>dirty</th><th>unpushed</th><th>size</th><th>state</th><th></th></tr>'+R.map(r=>`<tr><td><input type="checkbox" data-s="${esc(r.path)}" ${sel.has(r.path)?'checked':''} ${r.state==='running'?'disabled':''}></td><td>${esc(r.repo.split('/').pop())}</td><td title="${esc(r.path)}">${esc(sk(r).split('/').slice(-1)[0])}</td><td>${esc(r.branch||'')}</td><td>${r.missing?'':r.days+'d'}</td><td>${r.dirty||''}</td><td>${r.unpushed||''}</td><td data-sz="${esc(r.path)}"></td><td><span class="pill st-${r.eligible?'done':r.state==='running'?'active':'later'}"><i></i>${r.state}</span></td><td>${r.state==='running'?'':`<button class="rm1" data-r="${esc(r.path)}">remove</button>`}</td></tr>`).join('');
    $('#wtt').querySelectorAll('.rm1').forEach(b=>b.onclick=()=>ask([W.rows.find(r=>r.path===b.dataset.r)]));
    $('#wtt').querySelectorAll('[data-s]').forEach(c=>c.onchange=()=>{c.checked?sel.add(c.dataset.s):sel.delete(c.dataset.s);upd()});upd()};
  $('#wsf').onchange=paint;$('#wsq').oninput=paint;$('#wsa').onclick=()=>{shown().filter(r=>r.state!=='running').forEach(r=>sel.add(r.path));paint()};$('#wsn').onclick=()=>{sel.clear();paint()};
  $('#wrs').onclick=()=>ask(W.rows.filter(r=>sel.has(r.path)));
  const ask=rows=>{
    const risky=rows.filter(r=>r.dirty||r.unpushed),box=$('#wbox'),db=$('#wdb').checked;
    box.innerHTML=`<div class="card"><b>Remove ${rows.length} worktree(s)?</b>
      <div class="mut">The checked-out folder is deleted, including ignored files such as .env. ${db?'Branches are deleted only if fully merged.':'Branches are kept, so committed work is not lost.'}</div>
      ${risky.length?`<div class="mut" style="color:#d33">${risky.length} have uncommitted changes or unpushed commits: ${risky.slice(0,6).map(r=>esc(sk(r).split('/').pop())+' ('+(r.dirty?r.dirty+' dirty':'')+(r.dirty&&r.unpushed?', ':'')+(r.unpushed?r.unpushed+' unpushed':'')+')').join('; ')}${risky.length>6?' ...':''}. Uncommitted changes will be LOST.</div><label><input type="checkbox" id="wfc"> I understand, force-remove those too</label>`:''}
      <div class="row"><button class="primary" id="wgo">Yes, remove</button><button id="wno">cancel</button></div></div>`;
    box.scrollIntoView({block:'center'});$('#wno').onclick=()=>box.innerHTML='';
    $('#wgo').onclick=async()=>{const force=!!($('#wfc')&&$('#wfc').checked),paths=rows.filter(r=>force||!(r.dirty||r.unpushed)||r.eligible).map(r=>r.path);
      $('#wgo').disabled=true;$('#wgo').textContent='removing...';
      const res=await api('/api/wt-remove-many',{paths,force,deleteBranch:db});const ok=res.filter(x=>x.ok).length,bad=res.filter(x=>x.error);
      box.innerHTML=`<div class="card"><b>Removed ${ok} of ${rows.length}.</b>${rows.length-paths.length?`<div class="mut">${rows.length-paths.length} skipped (dirty/unpushed, force not ticked).</div>`:''}${bad.map(x=>`<div class="mut" style="color:#d33">${esc(sk({path:x.path}))}: ${esc(x.error)}</div>`).join('')}<div class="row"><button id="wdone">refresh list</button></div></div>`;
      $('#wdone').onclick=()=>drawWt(true)}};
  paint();
  el.querySelectorAll('[data-o]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete orphan folder '+b.dataset.o+'?'))return;const r=await api('/api/orphan-remove',{path:b.dataset.o});if(r.error)alert(r.error);drawWt(true)});
  for(const td of el.querySelectorAll('[data-sz]')){if(tab!=='wt')break;const r=await api('/api/du?path='+encodeURIComponent(td.dataset.sz));if(r.kb!=null)td.textContent=r.kb>1024?(r.kb/1024).toFixed(0)+' MB':r.kb+' KB'}
}
/* ---- transcript search ---- */
let lastQ='';
async function drawSearch(){
  const el=$('#srp');if($('#q').value)lastQ=$('#q').value;
  el.innerHTML=`<div class="bar"><input id="sq2" value="${esc(lastQ)}" placeholder="text to find inside all chats (3+ chars)" style="flex:1"><button id="sg">Search</button></div><div id="sr"></div>`;
  const go=async()=>{lastQ=$('#sq2').value;if(lastQ.trim().length<3){$('#sr').innerHTML='<p class="mut">type at least 3 characters</p>';return}$('#sr').innerHTML='<p class="mut">searching all transcripts...</p>';
    const R=await api('/api/search?q='+encodeURIComponent(lastQ)),re=new RegExp('('+lastQ.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');
    $('#sr').innerHTML=R.length?`<div class="mut">${R.length} session(s) matched${R.length>=40?' (showing 40 most recent)':''}</div>`+R.map(r=>`<div class="card"><h3><a href="#" data-j="${r.id}">${esc(r.title)}</a> <span class="badge">${esc(r.repo.split('/').pop())}</span> <span class="mut">${ago(r.mtime)}</span> ${acts(r.id)}</h3>${r.hits.map(x=>`<div class="q"><b>${x.who==='user'?'you':'claude'}:</b> ${esc(x.text).replace(re,'<span class="hl">$1</span>')}</div>`).join('')}</div>`).join(''):'<p class="mut">no matches</p>';
    $('#sr').querySelectorAll('[data-j]').forEach(a=>a.onclick=e=>{e.preventDefault();jump(a.dataset.j)})};
  $('#sg').onclick=go;$('#sq2').onkeydown=e=>{if(e.key==='Enter')go()};if(lastQ.length>=3)go();
}
$('#qs').onclick=()=>setTab('search');
/* ---- theme + shortcuts ---- */
$('#th').onclick=()=>{const d=document.documentElement,cur=d.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'),n=cur==='dark'?'light':'dark';d.dataset.theme=n;LSx.set('theme',n)};
document.body.insertAdjacentHTML('beforeend','<div id="help"><b>Shortcuts</b><br>/ search &nbsp; j / k next / previous card<br>a active &nbsp; l later &nbsp; r revisit &nbsp; d done<br>b board / cards &nbsp; ? this help</div>');
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;const t=e.target.tagName;if(/INPUT|TEXTAREA|SELECT/.test(t))return;
  const cards=[...document.querySelectorAll('#list .card')];let i=cards.findIndex(c=>c.classList.contains('foc'));
  if(e.key==='/'){e.preventDefault();setTab('sessions');$('#q').focus()}
  else if(e.key==='?')$('#help').style.display=$('#help').style.display==='block'?'none':'block';
  else if(e.key==='b'){view=view==='board'?'cards':'board';draw()}
  else if((e.key==='j'||e.key==='k')&&cards.length){if(i>=0)cards[i].classList.remove('foc');i=e.key==='j'?Math.min(cards.length-1,i+1):Math.max(0,i-1);cards[i].classList.add('foc');cards[i].scrollIntoView({block:'center'})}
  else if('alrd'.includes(e.key)&&i>=0){const k={a:'active',l:'later',r:'revisit',d:'done'}[e.key],id=cards[i].dataset.id;api('/api/tag',{id,status:k}).then(()=>{focusId=id;load()})}
});
if(/^#\/\w+/.test(location.hash))route();else setTab('sessions');
$('#q').oninput=draw;$('#hb').onchange=draw;
load().then(()=>{if(proj!=='ALL')loadRules()});setInterval(poll,10000);
